[project]
name = "music2latent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.9.0,<3.10"
readme = "README.md"
dependencies = [
    "huggingface-hub",
    "transformers>=4.30",
    "laion-clap<1.1.7",
    "librosa>=0.11.0",
    "matplotlib>=3.9.4",
    "resampy>=0.4.3",
    "soundfile>=0.13.1",
    "tensorboard>=2.20.0",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
    "tqdm>=4.67.1",
    "wandb<0.22",
    "pip-system-certs>=4.0",
    "certifi>=2026.1.4",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

